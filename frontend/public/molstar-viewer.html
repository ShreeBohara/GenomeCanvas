<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenomeCanvas Structure Viewer</title>
    <link rel="stylesheet" href="/vendor/molstar-viewer/molstar.css" />
    <style>
      html,
      body,
      #viewer {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #06131f;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script src="/vendor/molstar-viewer/molstar.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const structureUrl = params.get("url");
      const label = params.get("label") || "Structure";
      const format = params.get("format") || "mmcif";
      const message = document.createElement("div");
      message.style.cssText =
        "position:absolute;inset:0;display:grid;place-items:center;color:#eff6ff;font-family:Avenir Next, sans-serif;";

      async function boot() {
        if (!structureUrl || !window.molstar || !window.molstar.Viewer) {
          message.textContent = "Unable to initialize Molstar.";
          document.body.appendChild(message);
          return;
        }

        const viewer = await window.molstar.Viewer.create("viewer", {
          layoutShowControls: false,
          layoutShowSequence: false,
          layoutShowLog: false,
          layoutShowLeftPanel: false,
          viewportShowExpand: false,
          viewportShowControls: true,
          collapseLeftPanel: true
        });

        await viewer.loadStructureFromUrl(structureUrl, format, false, { label });
      }

      boot().catch((error) => {
        message.textContent = `Molstar failed to load: ${error.message}`;
        document.body.appendChild(message);
      });
    </script>
  </body>
</html>
