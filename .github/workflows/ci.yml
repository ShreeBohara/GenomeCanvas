# Every `run:` is a fixed command string: no expression interpolates untrusted
# input from the event, so nothing a pull request writes can reach a shell.
name: CI

on:
  push:
    branches: [v2, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, format, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # pnpm comes from corepack, which is not on PATH when setup-node
          # would look for it, so its automatic cache is turned off.
          package-manager-cache: false
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Check
        run: corepack pnpm check

  python:
    name: Python (ruff, mypy, pytest, licence ledger)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.29"
          working-directory: forge
      - name: Install
        # --locked also fails if uv.lock no longer matches pyproject.toml.
        run: uv sync --locked
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest
      - name: Licence ledger
        # Uses today's date, so a licence check older than 180 days turns CI red.
        run: uv run --frozen python -m forge.ledger check
