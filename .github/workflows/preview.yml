# A preview of every pull request: a version of the staging Worker with its own
# address, pr-<number>-genomecanvas-staging.<subdomain>.workers.dev, posted as
# one comment that is updated in place on every push.
#
# This uses `pull_request`, never `pull_request_target`: a pull request from a
# fork gets no secrets, so its preview is skipped, and nothing from a fork ever
# runs with the token. Until the owner stores the Cloudflare secrets, every
# preview is skipped, not failed. Every `run:` is a fixed command string.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Look for Cloudflare credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      present: ${{ steps.look.outputs.present }}
    steps:
      - id: look
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare secrets are available to this run, so the preview is skipped."
          fi

  preview:
    name: Upload a preview
    needs: credentials
    if: needs.credentials.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WRANGLER_SEND_METRICS: "false"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.29"
          working-directory: forge
      - name: Install
        run: |
          corepack pnpm install --frozen-lockfile
          (cd forge && uv sync --locked)
      - name: Build the sample release
        run: corepack pnpm run release:sample
      - name: Build the app against this pull request's own release
        # The preview reads /release/pr-<number>/, so it never replaces the
        # manifest the staging site reads.
        run: |
          export CLOUDFLARE_ENV=staging
          export VITE_RELEASE_BASE_URL="/release/pr-$PR_NUMBER/"
          corepack pnpm run build
      - name: Upload the sample release under pr-<number>
        run: corepack pnpm --filter @genomecanvas/web run release:upload ../../build/release/sample --release "pr-$PR_NUMBER" --env staging --apply
      - name: Upload a preview version of the Worker
        id: upload
        working-directory: apps/web
        # `versions upload` does not deploy: staging keeps serving its own version.
        run: |
          WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson" \
            corepack pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER" --message "Pull request $PR_NUMBER"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$RUNNER_TEMP/wrangler-output.ndjson" | head -n1)
          if [ -z "$url" ]; then
            echo "::error::wrangler reported no preview address. Are preview URLs on for the staging Worker (runbook, step 3)?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the preview
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: corepack pnpm --filter @genomecanvas/web run deploy:check "$PREVIEW_URL" --release "pr-$PR_NUMBER" --manifest ../../build/release/sample/manifest.json

  comment:
    name: Post the preview address
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # The only job allowed to write to the pull request.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- genomecanvas-preview -->";
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              `**Preview:** ${url}`,
              "",
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. This comment is updated on every push.`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
