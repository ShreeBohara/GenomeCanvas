[project]
name = "forge"
version = "0.1.0"
description = "The GenomeCanvas data pipeline: open sources in, a versioned and licence-tracked release out."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.1",
    "pyarrow==26.0.1",
    "pyyaml==6.0.4",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.6",
    "types-pyyaml==6.0.12.20261122",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.29"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes
    "I",            # import order
    "B",            # likely bugs
    "BLE",          # no blind `except Exception`
    "UP",           # modern syntax
    "N",            # naming
    "S",            # security
    "SIM",          # simplifications
    "PT",           # pytest style
    "ANN",          # every function annotated
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests are made of asserts.
"**/test_*.py" = ["S101"]
# Checks and the sample rules build SQL from table names and status words
# written in the code itself; no outside text reaches these queries.
"src/forge/uniprot/checks.py" = ["S608"]
"src/forge/sample.py" = ["S608"]
# Test inputs written as UniProt lays them out, one element per line.
"src/forge/testdata/*.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
warn_unreachable = true

# pyarrow publishes no type information. It is imported in one place,
# forge.pipeline.arrow, which gives the rest of the code typed functions.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = ["--strict-markers", "--strict-config", "--disable-socket"]
