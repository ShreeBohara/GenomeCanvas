# The licence ledger: one row per data source GenomeCanvas takes from.
#
# A row may say `status: verified` only when someone has read the licence page
# or file at `licence_url` on the `checked` date. Until then the licence is
# recorded as unknown (`licence: null`), even where the plan names one, and the
# source may not be used (`in_use: false`). `python -m forge.ledger check` fails
# on any row that breaks these rules, and on any verified row whose check is
# more than 180 days old.
#
# Seeded on 2026-11-25 from plan section 4.4 and its Appendix B. Licences are
# SPDX identifiers.

- id: uniprot
  name: UniProt Knowledgebase (Swiss-Prot, human), including its ProtT5 embeddings
  version: "2026_04"
  url: https://www.uniprot.org
  licence: null
  licence_url: null
  checked: null
  attribution: null
  in_use: false
  status: unverified
  note: The plan names CC BY 4.0; the licence page has not been read.

